name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, test & accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (+ system deps)
        run: npx playwright install --with-deps chromium

      - name: Lint & format check
        run: npm run lint

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Build (Eleventy + Pagefind)
        run: npm run build

      - name: HTML validation
        run: npm run test:html

      - name: Functional + accessibility e2e (light + dark)
        run: npm run test:e2e

      - name: Accessibility — pa11y (HTML CodeSniffer)
        run: npm run test:a11y

      - name: Accessibility — Lighthouse (score gate ≥ 100)
        run: npm run test:lh

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            coverage/
            playwright-report/
            .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7
