name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily — publishes date-gated talk announcements
  workflow_dispatch:

# Cancel superseded PR runs; never cancel a main/schedule run (it may be deploying).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Build, test & accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (+ system deps)
        run: npx playwright install --with-deps chromium

      - name: Lint & format check
        run: npm run lint

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Build (Eleventy + Pagefind)
        run: npm run build

      - name: HTML validation
        run: npm run test:html

      - name: Functional + accessibility e2e (light + dark)
        run: npm run test:e2e

      - name: Accessibility — pa11y (HTML CodeSniffer)
        run: npm run test:a11y

      - name: Accessibility — Lighthouse (score gate ≥ 100)
        run: npm run test:lh

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: |
            coverage/
            playwright-report/
            .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7

  # Deploy to Cloudflare Pages (direct upload) once the full gauntlet is green.
  # Runs on pushes to main, the daily schedule (publishes date-gated talks), and
  # manual dispatch — never on pull requests (they only get verified). Needs two
  # repository secrets: CLOUDFLARE_API_TOKEN (scoped to Pages: Edit) and
  # CLOUDFLARE_ACCOUNT_ID. Without them the step fails loudly rather than
  # deploying a half-configured site.
  deploy:
    name: Deploy to Cloudflare Pages
    needs: verify
    # Only ever deploy main: push-to-main, the schedule (runs on the default
    # branch), or a manual dispatch from main. This stops a workflow_dispatch on
    # a feature branch from publishing that branch to production (the deploy step
    # forces --branch=main).
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialise production deploys; never cancel one that is already uploading.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Eleventy + Pagefind)
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=silavapi --branch=main
